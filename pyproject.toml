[project]
name = "douban-top250"
version = "1.0.0"
description = "豆瓣电影 Top250 爬虫：抓取、Pandas 清洗与 Excel 报表"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pandas>=1.1.0",
    "openpyxl>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
